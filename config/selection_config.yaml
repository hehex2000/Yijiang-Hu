# 多因子选股配置文件
# 使用方法: python run_selector.py --config config/selection_config.yaml

# ==================== 数据配置 ====================
data:
  base_date: "20230103"  # 基准日期（交易日，格式: YYYYMMDD）
  use_sqlite: true        # 是否使用SQLite数据库
  db_path: "D:/tu-shareData/astock_daily.db"  # 数据库路径
  
  # 股票池筛选
  stock_pool:
    list_date_before: "20230103"  # 在此日期前上市的股票
    exclude_st: true                # 排除ST股票
    exclude_suspended: true        # 排除停牌股票

# ==================== 因子配置 ====================
factors:
  # 选择要使用的因子类别（true/false）
  value: true        # 价值因子（PE、PB、PS、股息率）
  growth: false      # 成长因子（需要财务数据）
  quality: false     # 质量因子（需要财务数据）
  momentum: true     # 动量因子（1/3/6/12个月收益率）
  technical: true    # 技术因子（均线多头、量比）
  volatility: true   # 低波动因子（历史波动率、下行波动、VaR）

  # 因子权重（总和应为1.0，仅启用的因子生效）
  weights:
    value: 0.20
    growth: 0.0
    quality: 0.0
    momentum: 0.25
    technical: 0.20
    volatility: 0.35  # 低波动因子权重最高（A股低波动异象显著）
  
# ==================== 选股配置 ====================
selection:
  top_n: 5           # 选择TOP N股票
  min_score: 0.0      # 最小得分阈值（0表示不筛选）
  
  # 排序方式
  sort_by: "total_score"  # 按总分排序
  ascending: false        # false=降序（高分在前）

# ==================== 输出配置 ====================
output:
  format: "csv"          # 输出格式: csv 或 excel
  output_dir: "data/results"
  filename: "top10_stocks.csv"  # 文件名（可选，自动生成）
  
  # 输出字段（中文名）
  fields:
    - "排名"
    - "股票代码"
    - "股票名称"
    - "总得分"
    - "市值"
    - "最近收盘价"

# ==================== 日志配置 ====================
logging:
  level: "INFO"
  save_to_file: true
  log_file: "logs/selection.log"
