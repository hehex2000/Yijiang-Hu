# 多因子选股配置文件
# 使用方法: python run_selector.py --config config/selection_config.yaml

# ==================== 数据配置 ====================
data:
  base_date: "20230103"  # 基准日期（交易日，格式: YYYYMMDD）
  use_sqlite: true        # 是否使用SQLite数据库
  db_path: "D:/tu-shareData/astock_daily.db"  # 数据库路径
  
  # 股票池筛选
  stock_pool:
    list_date_before: "20230103"  # 在此日期前上市的股票
    exclude_st: true                # 排除ST股票
    exclude_suspended: true        # 排除停牌股票

# ==================== 因子配置 ====================
factors:
  # 选择要使用的因子类别（true/false）
  value: true        # 价值因子（PE、PB、PS、股息率、EV/EBITDA）
  growth: true       # 成长因子（营收/利润增长率、ROE、ROA）
  quality: true      # 质量因子（资产负债率、流动比率、现金流质量）
  momentum: true     # 动量因子（1/3/6/12个月收益率）
  technical: true    # 技术因子（均线多头、MACD、RSI、量比、布林带）
  volatility: true   # 低波动因子（历史波动率、beta、下行波动、VaR）
  money_flow: false  # 资金流因子（主力净流入、资金强度，回测时建议关）

  # 加权方式: "equal"(等权重) 或 "custom"(自定义权重)
  weighting_method: "custom"

  # 因子权重（weighting_method=custom时生效，总和自动归一化）
  weights:
    value_score: 0.25       # 价值因子 25%
    growth_score: 0.15      # 成长因子 15%
    quality_score: 0.10     # 质量因子 10%
    momentum_score: 0.20    # 动量因子 20%
    technical_score: 0.10   # 技术因子 10%
    volatility_score: 0.15  # 低波动因子 15%（A股低波动异象显著）
    money_flow_score: 0.05  # 资金流因子 5%

# ==================== 选股配置 ====================
selection:
  top_n: 20          # 选择TOP N股票
  min_score: 0.0      # 最小得分阈值（0表示不筛选）
  
  # 排序方式
  sort_by: "total_score"  # 按总分排序
  ascending: false        # false=降序（高分在前）

# ==================== 输出配置 ====================
output:
  format: "csv"          # 输出格式: csv 或 excel
  output_dir: "data/results"
  filename: "top10_stocks.csv"  # 文件名（可选，自动生成）
  
  # 输出字段（中文名）
  fields:
    - "排名"
    - "股票代码"
    - "股票名称"
    - "总得分"
    - "市值"
    - "最近收盘价"

# ==================== 日志配置 ====================
logging:
  level: "INFO"
  save_to_file: true
  log_file: "logs/selection.log"
